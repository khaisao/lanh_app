name: lanh_app
description: Lanh nutrition companion for Vietnam, Android and iOS.
version: 0.1.0+1
publish_to: none
workspace:
  - packages/app_ui
environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  http: ^1.6.0
  http_parser: ^4.1.2
  app_ui: ^0.1.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  camera: ^0.12.2
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  speech_to_text: ^7.5.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.6
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/design/icons/
    - assets/design/images/
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 100
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 900
